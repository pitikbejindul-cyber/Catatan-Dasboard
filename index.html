<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BarnFinance - Rustic Livestock Management</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts: Plus Jakarta Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <style>
        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        /* Background Warm Earthy / Rustic Farmhouse */
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #fefae0 0%, #f4f1de 50%, #e9edc9 100%);
            background-attachment: fixed;
            color: #283618;
            min-height: 100vh;
        }

        /* Rustic Glassmorphism Card */
        .card-rustic {
            background: rgba(255, 255, 255, 0.82);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(221, 161, 94, 0.25);
            border-radius: 24px;
            box-shadow: 0 10px 30px -5px rgba(96, 108, 56, 0.08),
                        0 4px 12px -2px rgba(0, 0, 0, 0.03);
        }

        .card-rustic-hover {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .card-rustic-hover:hover {
            transform: translateY(-2px);
            background: rgba(255, 255, 255, 0.95);
            border-color: rgba(221, 161, 94, 0.5);
            box-shadow: 0 16px 35px -5px rgba(96, 108, 56, 0.15);
        }

        .fade-in {
            animation: fade .35s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fade {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Custom Scrollbar for Rustic Theme */
        #timeline {
            max-height: 620px;
            overflow-y: auto;
        }

        #timeline::-webkit-scrollbar {
            width: 6px;
        }

        #timeline::-webkit-scrollbar-thumb {
            background: rgba(188, 108, 37, 0.3);
            border-radius: 999px;
        }

        #timeline::-webkit-scrollbar-thumb:hover {
            background: rgba(188, 108, 37, 0.5);
        }
    </style>
</head>

<body class="p-4 sm:p-6 md:p-10">

<div class="max-w-5xl mx-auto space-y-6">

    <!-- HEADER SECTION -->
    <div class="card-rustic p-6 sm:p-8 md:p-10 relative overflow-hidden">
        <!-- Floating Earthy Glows -->
        <div class="absolute -top-12 -right-12 w-48 h-48 bg-amber-300/30 rounded-full blur-3xl pointer-events-none"></div>
        <div class="absolute -bottom-12 -left-12 w-48 h-48 bg-emerald-300/20 rounded-full blur-3xl pointer-events-none"></div>

        <div class="relative z-10 flex flex-col md:flex-row md:items-center justify-between gap-6">
            <div>
                <!-- Brand Badge -->
                <div class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-[#dda15e]/15 border border-[#dda15e]/30 mb-3">
                    <svg class="w-4 h-4 text-[#bc6c25]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path>
                    </svg>
                    <span class="text-xs font-bold text-[#bc6c25] tracking-wider uppercase">Barnyard Management</span>
                </div>

                <h1 class="text-3xl sm:text-4xl md:text-5xl font-extrabold text-[#283618] tracking-tight leading-tight">
                    Dashboard <span class="text-transparent bg-clip-text bg-gradient-to-r from-[#bc6c25] to-[#606c38]">Keuangan</span>
                </h1>
                <p class="text-sm sm:text-base text-[#606c38] mt-2 font-medium">
                    Utamakan Kebutuhan 
                </p>
            </div>
            
            <!-- Realtime Status Indicator -->
            <div class="inline-flex items-center gap-3 px-4 py-2.5 rounded-2xl bg-white/90 border border-[#dda15e]/30 shadow-sm self-start md:self-center">
                <span class="relative flex h-3 w-3">
                  <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-[#606c38] opacity-75"></span>
                  <span class="relative inline-flex rounded-full h-3 w-3 bg-[#606c38]"></span>
                </span>
                <div class="flex flex-col">
                    <span class="text-[10px] uppercase font-bold text-slate-400 tracking-wider">Feed Sync</span>
                    <span class="text-xs font-bold text-[#283618]">Bot Live Connected</span>
                </div>
            </div>
        </div>
    </div>

    <!-- METRICS CARDS SECTION -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
        
        <!-- Total Pengeluaran Card (Earthy Gradient) -->
        <div class="card-rustic p-7 bg-gradient-to-br from-[#283618] via-[#386641] to-[#606c38] text-white border-transparent shadow-xl shadow-[#283618]/15 relative overflow-hidden">
            <div class="absolute -right-8 -bottom-8 w-36 h-36 bg-white/10 rounded-full blur-2xl pointer-events-none"></div>
            
            <div class="flex items-center justify-between">
                <p class="text-xs font-extrabold uppercase tracking-widest text-amber-200">
                    Total Pengeluaran
                </p>
                <div class="p-2 bg-white/10 rounded-xl backdrop-blur-md">
                    <svg class="w-5 h-5 text-amber-200" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                </div>
            </div>

            <h2 id="totalPengeluaran" class="text-3xl sm:text-4xl md:text-5xl font-black mt-4 text-white tracking-tight">
                Rp 0
            </h2>
            <div class="mt-3 flex items-center gap-2 text-xs text-amber-100/90">
                <span class="inline-block w-2 h-2 rounded-full bg-amber-400"></span>
                <span>Akumulasi biaya pakan & pemeliharaan</span>
            </div>
        </div>

        <!-- Jumlah Transaksi Card -->
        <div class="card-rustic p-7 relative overflow-hidden">
            <div class="flex items-center justify-between">
                <p class="text-xs font-extrabold uppercase tracking-widest text-[#606c38]">
                    Jumlah Transaksi
                </p>
                <div class="p-2 bg-[#dda15e]/20 rounded-xl">
                    <svg class="w-5 h-5 text-[#bc6c25]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"></path>
                    </svg>
                </div>
            </div>

            <h2 id="jumlahTransaksi" class="text-3xl sm:text-4xl md:text-5xl font-black mt-4 text-[#283618] tracking-tight">
                0
            </h2>
            <div class="mt-3 flex items-center gap-2 text-xs text-[#606c38]">
                <span>Log aktivitas tercatat di sistem</span>
            </div>
        </div>
    </div>

    <!-- TRANSACTION TIMELINE CONTAINER -->
    <div class="card-rustic overflow-hidden">
        <!-- Timeline Header -->
        <div class="px-6 py-5 border-b border-[#dda15e]/20 flex justify-between items-center bg-white/60">
            <div class="flex items-center gap-3">
                <div class="w-2.5 h-6 bg-[#bc6c25] rounded-full"></div>
                <h2 class="font-bold text-[#283618] text-xs sm:text-sm uppercase tracking-wider">
                    Log Riwayat Transaksi Kandang
                </h2>
            </div>

            <button
                id="refreshBtn"
                class="text-xs bg-[#bc6c25] hover:bg-[#a35d20] active:scale-95 text-white disabled:opacity-50 disabled:pointer-events-none px-6 py-2.5 rounded-xl font-bold transition-all shadow-md shadow-[#bc6c25]/20 flex items-center justify-center gap-2 min-w-[110px]"
            >
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                </svg>
                <span>Refresh</span>
            </button>
        </div>

        <!-- Timeline List Container -->
        <div id="timeline" class="p-6 space-y-4">
            <div class="text-center py-12 text-[#606c38] animate-pulse italic text-sm flex flex-col items-center justify-center gap-2">
                <svg class="w-8 h-8 text-[#bc6c25] animate-spin" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <span>Mengambil data catatan kandang...</span>
            </div>
        </div>
    </div>

</div>

<script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxpw8koHdntS2rvxf8trZHZN664OB4a9wA6-GhaYd9RDWXUYIY9vPQKJGNQ5jqu8Ulc3g/exec";
    const CACHE_KEY = "finance_dashboard_cache_data";

    const totalEl = document.getElementById('totalPengeluaran');
    const jumlahEl = document.getElementById('jumlahTransaksi');
    const timelineEl = document.getElementById('timeline');
    const refreshBtn = document.getElementById('refreshBtn');

    function formatRupiah(num) {
        return new Intl.NumberFormat('id-ID', {
            style: 'currency',
            currency: 'IDR',
            minimumFractionDigits: 0
        }).format(num || 0);
    }

    function formatTanggal(dateString) {
        if (!dateString) return '-';
        const date = new Date(dateString);
        if (isNaN(date.getTime())) return dateString; 
        
        return new Intl.DateTimeFormat('id-ID', {
            day: 'numeric',
            month: 'long',
            year: 'numeric'
        }).format(date);
    }

    // Badge style khusus tema Rustic Farmhouse
    function getBadgeStyle(deskripsi) {
        const teks = (deskripsi || '').toLowerCase();
        if (teks.includes('makan') || teks.includes('minum') || teks.includes('kopi') || teks.includes('kuliner')) {
            return { bg: 'bg-amber-500/15 text-amber-800 border-amber-300/60', label: 'Kuliner' };
        }
        if (teks.includes('bensin') || teks.includes('ojek') || teks.includes('transport') || teks.includes('gofood') || teks.includes('grab')) {
            return { bg: 'bg-blue-500/15 text-blue-800 border-blue-300/60', label: 'Transport' };
        }
        if (teks.includes('listrik') || teks.includes('air') || teks.includes('wifi') || teks.includes('kos') || teks.includes('pulsa')) {
            return { bg: 'bg-orange-500/15 text-orange-800 border-orange-300/60', label: 'Tagihan' };
        }
        return { bg: 'bg-[#606c38]/15 text-[#283618] border-[#606c38]/30', label: 'Pakan & Ternak' };
    }

    function batasiTeks(teks, batas = 65) {
        if (!teks) return 'Transaksi';
        return teks.length > batas ? teks.substring(0, batas) + '...' : teks;
    }

    function prosesDanTampilkanData(data) {
        if (!Array.isArray(data)) return;

        const total = data.reduce((acc, item) => {
            const nilai = parseFloat(item.jumlah) || 0;
            return acc + Math.round(nilai * 100);
        }, 0) / 100;

        totalEl.textContent = formatRupiah(total);
        jumlahEl.textContent = data.length;

        render([...data].reverse());
    }

    async function muatData() {
        if (refreshBtn.disabled) return; 

        try {
            refreshBtn.disabled = true;
            refreshBtn.textContent = "Memuat...";

            const response = await fetch(`${WEB_APP_URL}?action=read`);
            const data = await response.json();

            if (data.error) throw new Error(data.error);

            localStorage.setItem(CACHE_KEY, JSON.stringify(data));
            prosesDanTampilkanData(data);

        } catch (err) {
            console.error(err);

            const dataLokal = localStorage.getItem(CACHE_KEY);
            if (dataLokal) {
                prosesDanTampilkanData(JSON.parse(dataLokal));
                return;
            }

            timelineEl.innerHTML = `
                <div class="text-center py-10">
                    <p class="text-rose-700 font-bold">Data gagal dimuat</p>
                    <p class="text-xs text-[#606c38] mt-1">
                        Terjadi kesalahan saat mengambil data server. Periksa koneksi internet Anda.
                    </p>
                </div>
            `;
        } finally {
            refreshBtn.disabled = false;
            refreshBtn.textContent = "Refresh";
        }
    }

    function render(data) {
        if (!data.length) {
            timelineEl.innerHTML = `
                <p class="text-center py-10 text-[#606c38] italic">Belum ada transaksi tercatat.</p>
            `;
            return;
        }

        timelineEl.innerHTML = data.map(item => {
            const jumlah = parseFloat(item.jumlah) || 0;
            const badge = getBadgeStyle(item.deskripsi);
            const tanggalDiformat = formatTanggal(item.tanggal);
            const deskripsiAman = batasiTeks(item.deskripsi);

            return `
                <div class="card-rustic card-rustic-hover p-5 fade-in">
                    <div class="flex justify-between items-start gap-4">
                        <div class="min-w-0">
                            <div class="flex items-center gap-2 mb-2">
                                <span class="text-[10px] px-2.5 py-0.5 rounded-md bg-white text-[#606c38] font-bold border border-[#dda15e]/30">
                                    #${item.id || '0'}
                                </span>
                                <span class="text-[10px] uppercase tracking-wider font-extrabold px-2.5 py-0.5 rounded-md border ${badge.bg}">
                                    ${badge.label}
                                </span>
                            </div>
                            <p class="text-sm md:text-base font-bold text-[#283618] break-words tracking-tight">
                                ${deskripsiAman}
                            </p>
                            <p class="text-[11px] text-[#606c38] font-medium mt-1">
                                ${tanggalDiformat}
                            </p>
                        </div>
                        <div class="shrink-0 text-right">
                            <p class="text-[#bc6c25] font-extrabold text-base md:text-xl tracking-tight">
                                ${formatRupiah(jumlah)}
                            </p>
                        </div>
                    </div>
                </div>
            `;
        }).join('');
    }

    refreshBtn.addEventListener('click', muatData);

    window.onload = () => {
        const dataLokal = localStorage.getItem(CACHE_KEY);
        if (dataLokal) {
            try {
                prosesDanTampilkanData(JSON.parse(dataLokal));
            } catch (e) {
                localStorage.removeItem(CACHE_KEY);
            }
        }
        muatData();
    };
</script>

</body>
</html>
